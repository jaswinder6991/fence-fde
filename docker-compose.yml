services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fence
      POSTGRES_PASSWORD: fence
      POSTGRES_DB: fence
    ports:
      - "5432:5432"
    volumes:
      - fence_pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fence -d fence"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  fence_pgdata:
